name: Validate Story2

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test manuscript and audiobook preparation
        run: python -m unittest discover -s tests -v
      - name: Validate chapter audio preparation without a TTS model
        run: python tools/render_audio.py --dry-run
